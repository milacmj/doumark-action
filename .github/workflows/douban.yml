name: doumark sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  doumark:
    runs-on: ubuntu-latest
    steps:
      - name: doumark action
        uses: lizheming/doumark-action@master
        with:
          id: ${{ secrets.DOUBAN_NAME }}
          type: book
          format: notion
          dir: ${{ secrets.NOTION_BOOK_URL }}
          notion_token: ${{ secrets.NOTION_TOKEN }}
          status: mark,doing,done
